planning:
  model: gpt-5.6-sol
  agent: dformer-planner

execution:
  model: gpt-5.6-terra
  agent: dformer-executor

verification:
  model: gpt-5.6-terra
  agent: dformer-verifier

subagents:
  max_direct_children: 4
  allow_nested_children: false
  require_isolated_worktree_for_parallel_edits: true

workflow:
  require_plan_before_execution: true
  auto_continue_after_plan: true
  require_verification_after_execution: true
  auto_commit: false

compatibility:
  existing_skills:
    - .agents/skills/compshare-cli/SKILL.md
    - .cursor/skills/research-progress-report/SKILL.md