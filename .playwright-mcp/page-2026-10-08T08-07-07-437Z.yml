          - text: "# LIB000044｜When Depth Hurts / GeoDistill 正文证据 > 正文事实与主代理重合判断分列（2026-10-08）。canonical正文：`D:\\0Project\\origin\\论文\\When Depth Hurts - Reliability-Aware Geometry Distillation for Depth-Free RGB-D Salient Object Detection\\When Depth Hurts - Reliability-Aware Geometry Distillation for Depth-Free RGB-D Salient Object Detection.md`；原摘要和书目不变。 > > 公式据正文。主代理额外核对 `Tables/Table_4.jpg`、`Table_5.jpg` 的depth策略/teacher消融，与下列正文数值一致；独立公式图及XLSX未完成核验，不宣称全部附件已读。 ## 深度不可靠的定义与任务边界 - Abstract/§1（正文前部，约 l.5–30）把不可靠深度列为 missing regions、blurred boundaries、foreground-background bleeding、weak contrast、structural artifacts；主张这些错误在多模态融合中传播，使 RGB-D detector 可能劣于 RGB-only。正文也指出可靠几何可能与 saliency 无关（如墙面、地面、背景结构）。 - 这是 depth-free RGB-D **salient object detection (SOD)**，不是 RGB-D semantic segmentation。作者对“RGB-D”的使用是遵循 benchmark 和比较协议；模型本身不读取 benchmark sensor-depth map。 - Figure 2：冻结 Depth Anything V2 仅在训练阶段作为 teacher；输入为 RGB，teacher transfers relative geometry、multi-scale features/attention 和 boundaries。最终模型保留 geometry branch，但 teacher 及其监督路径在 inference 时移除。正文 §5 protocol 还明确 `Dataset depth is ignored`。因此：**真实 dataset depth train/test 均不使用**；训练期间使用的是从 RGB 产生的冻结 teacher 预测，不是传感器 depth ground truth。Inference 只需要 RGB。 ## Geometry distillation 与监督公式 - §Teacher-Guided Geometry Learning，Eq.(2)–(7)，正文约 l.65–110：冻结教师输出相对深度 $D^T$ 及四级 teacher features $T_i$；student 输出多级深度预测 $D_k$、geometry feature $G_i$ 和边界 logit $E^G$。 - 预测值和梯度监督： $$ \\mathcal L_d=\\sum_{k=1}^{K}\\omega_k\\left(\\|\\sigma(D_k)-\\widetilde D^T\\|_1+\\eta\\mathcal L_{\\nabla}(\\sigma(D_k),\\widetilde D^T)\\right) $$ - teacher/student feature 不直接做 raw tensor regression，而对 channel-energy map 做归一化对齐： $$ \\mathcal A(F)=\\mathcal N\\left(\\frac{1}{C_F}\\sum_{c=1}^{C_F}F_c^2\\right),\\qquad \\mathcal L_a=\\frac14\\sum_{i=1}^{4}\\|\\mathcal A(G_i)-\\mathcal A(T_i)\\|_1 $$ - teacher depth gradient 导出的边界监督 geometry edge： $$ \\mathcal L_{ge}=\\mathrm{BCE}(E^G,\\mathrm{Edge}(\\widetilde D^T)) $$ - §Cross-Modal Enhancement，Eq.(8)–(9)，正文约 l.120–132：每层 native-resolution feature query 对另一分支 adaptive-average-pooled K/V 做双向 cross-attention，复杂度写作 $O(H_iW_iP^2)$；残差系数 $\\alpha_i,\\beta_i$ 初始化为 0。该 attention 是交互模块，不应与后述 reliability map 混成一个 modal scalar。 ## Pixelwise reliability 输入、gate 与监督 - §Reliability-Aware Geometry Fusion，Eq.(10)–(11)，正文 l.133–147：作者明示 estimate “a pixel-wise reliability map”。每层 reliability estimator 输入四项：跨模态增强后的 appearance $\\bar A_i$、geometry $\\bar G_i$、二者绝对差 $|\\bar A_i-\\bar G_i|$、经 resize 的 student geometry prediction $\\mathcal U_i(\\sigma(D))$： $$ r_i=\\sigma\\left(\\phi_i\\left([\\bar A_i,\\bar G_i,|\\bar A_i-\\bar G_i|,\\mathcal U_i(\\sigma(D))]\\right)\\right) $$ geometry 自身还有 channel-wise attention $q_i=\\sigma(\\psi_i(\\bar G_i))$；逐尺度融合为 RGB-dominant residual/multiplicative injection： $$ F_i=\\rho_i\\left(\\bar A_i\\odot(1+r_i\\odot q_i)+r_i\\odot\\bar G_i\\right) $$ 正文解释 $r_i$ 小时接近 appearance baseline；$r_i$ 大时 modulation 与 geometry residual injection 增强。这里的可靠性针对 learned monocular geometry 对 SOD 的任务适用性，并非传感器深度质量真值图。 - §saliency loss 与总目标，Eq.(12)–(13)，正文约 l.155–164：geometry prediction / feature / edge 由 $\\mathcal L_d,\\mathcal L_a,\\mathcal L_{ge}$ 监督；saliency 和 saliency edge 用 $\\mathcal L_s,\\mathcal L_e$，总损失： $$ \\mathcal L=\\mathcal L_s+\\lambda_e\\mathcal L_e+\\lambda_{ge}\\mathcal L_{ge}+\\lambda_d\\mathcal L_d+\\lambda_a\\mathcal L_a $$ 正文未报告独立 reliability-label 或直接监督 $r_i$ 的 loss；从 Eq.(13) 可见列出的损失项没有 reliability-target term，$r_i$ 经融合后由任务目标间接学习。参数句写作 $\\lambda_e=0.4,\\lambda_{qe}=0.1,\\lambda_d=0.2,\\lambda_a=0.05$，但 Eq.(13) 使用 $\\lambda_{ge}$ 而非 $\\lambda_{qe}$；请核公式图片/PDF，可能是正文转写或原文符号不一致，不要自行改正。 ## 数据协议、数值与可靠性相关消融 - §Experimental Protocol，正文 l.170 起：RGB-D SOD 训练集共 2,985 组 RGB-mask pairs（NJU2K 1,485、NLPR 700、DUT-RGBD 800），明确忽略数据集 depth。9 个 RGB-D benchmark 测试集：NJU2K 500、NLPR 300、DUT-RGBD 400、ReDWeb-S 1,000、SIP 929、SSD 80、STERE 1,000、COME-E 4,600、COME-H 3,000。另以 DUTS-TR 10,553 训练、四个 RGB SOD 数据集做泛化。 - Table 4（Depth-use strategies，正文约 l.214–221）比较 RGB-only / Raw depth / Distilled geometry。SIP 上 MAE 分别 `.046/.036/.033`；COME-H `.080/.067/.065`；Distilled geometry 相对 Raw depth 更低 MAE，作者报告分别降低 `8.3%/3.0%`。SIP 三项 region scores distilled 为 `.912/.928/.951`，COME-H 为 `.856/.869/.899`。 - Table 5（Geometry architecture and teacher-supervision ablation，正文约 l.229–236）比较 RGB-only、Geometry architecture（无 teacher guidance）和 Full model：SIP MAE `.046/.037/.033`，COME-H `.080/.068/.065`；full model 再加 Depth Anything V2 后，相对 geometry-architecture MAE 下降 `10.8%`（SIP）和 `4.4%`（COME-H）。Table 3 则是 projector capacity `C=64/128/256`，并非 reliability estimator 消融。 - **所有 reliability 消融边界**：正文给出 depth-use strategy、geometry-branch/teacher-supervision、capacity ablation；未找到单独去掉/固定 $r_i$、移除 $|\\bar A_i-\\bar G_i|$、移除 $q_i$、或改变 reliability map 粒度的直接 ablation。不得把 Table 4/5 说成完整的 reliability estimator 消融。 - Table 1 ReDWeb-S 的 GeoDistill MAE `.097`，作者报相对最佳 prior MAE 降低 `13.4%`；全文声称 36 个 metric-dataset comparisons 中 best/tied-best 26 个、其中 21 个 outright best。数值均待 Excel/PDF 核验。 ## 与既有 quality-aware 机制的对照证据 - 论文自述：既有 uncertainty / quality calibration / depth filtering / selective fusion 仍消费观测 depth；SATNet 将 monocular single-channel pseudo-depth 当作显式输入模态。GeoDistill 的差别主张是：丢弃 sensor depth，训练时用冻结 Depth Anything V2 多层指导 student，再用 pixelwise $r_i$ 决定 learned geometry 何时影响 RGB appearance（§Related Work、Pseudo-Depth Substitution、Fig.1/Fig.2）。这是作者的对照主张，需检查被引方法与表格，不能直接作为最终优先权/新颖性结论。 ## 主代理判断：与Reliability-Calibrated GSA的重合 - **问题定义重合较高**：深度/几何可能有害、需要选择性利用而不是无条件融合，已是本文中心动机。不能主张“首次提出不可靠depth主动伤害融合”。但本文不消费sensor depth；所估计的是RGB-derived geometry对SOD是否有用，本项目拟研究真实depth-derived GSA prior失真是不同对象。 - **可靠性估计概念重合较高**：appearance、geometry、绝对差、geometry prediction共同估计逐像素map。若本项目只是复制这些输入再sigmoid gate，应视为显著接近；将任务改成semantic segmentation不足以区分。本文没有RGB-token关系与depth pairwise prior的局部冲突定义，不直接覆盖这种对象。 - **geometry gating概念重合较高、作用位置不同**：本文gate在双向cross-attention增强之后，对feature作乘性调制+残差注入；v2候选校准在RGB attention聚合前控制depth-derived pairwise log bias。主代理由Eq8/11推导：r趋0只回到已增强的appearance A_bar，A_bar此前已经接触geometry，不保证回到未污染的原RGB。这是因果位置区别，不是本文缺陷已被实验验证，也不是本项目创新已成立。 - Table4的Raw-depth在SIP/COME-H上都**优于RGB-only**，故该表不能用于证明传感器depth在这两组整体结果上主动伤害RGB。作者的普遍动机与Figure3定性案例不同于定量证明；还需区分sensor-noise severity验证与跨数据集表现。 - 作者明确说depth-use策略比较**不是parameter-matched**，geometry仅task-oriented relative structure而非metric depth，训练仍有teacher成本。Table3默认C128报告111.76M参数/311.34G FLOPs；不是单独reliability head成本，正文未给独立reliability-removal消融或延迟。 - 本轮只记录候选方法边界，不实现模块、不裁定新颖性。 ## 已核对训练与策略细节 - 默认PVT-v2-B5 encoder、冻结Depth Anything V2-Small teacher、projector C128；student/teacher输入416×416/364×364；random crop+水平翻转；80epoch、batch4、AdamW，新模块lr7.5e-5/encoder7.5e-6，wd1.5e-4，gradient clip1.0，单RTX4090 24GB。teacher仅训练使用，推理删除；本轮没有下载或运行该模型。 - Table4按(S_m/Fmax/Emax/MAE)完整列：SIP RGB-only .883/.902/.931/.046，Raw .908/.923/.945/.036，Distilled .912/.928/.951/.033；COME-H RGB-only .831/.841/.875/.080，Raw .853/.866/.898/.067，Distilled .856/.869/.899/.065。 - Table5同列序：SIP无teacher geometry .908/.923/.945/.037，Full .912/.928/.951/.033；COME-H无teacher .854/.865/.896/.068，Full .856/.869/.899/.065；RGB-only同Table4。以上未隔离reliability的贡献。 - λ_ge/λ_qe正文符号不一致仍未核实；不修改原论文或以推测补正。ReDWeb排名统计仅为作者正文报告，未独立重算全部36项。"
